<!-- Loader Container -->
<ng-container *ngIf="isLoading; else content">
    <div class="flex flex-col items-center justify-center h-[95%]">
        <div class="spinner-grow text-primary" role="status"></div>
    </div>
</ng-container>
<!-- End Loader Container -->

<ng-template #content>

    <ng-container *ngIf="!isError; else noData">
        <!-- Container -->
        <div class="container-fixed">
            <div class="flex flex-wrap items-center lg:items-end justify-between gap-5 pb-7.5">
                <div class="flex flex-col justify-center gap-2">
                    <h1 class="text-xl font-medium leading-none text-gray-900">
                        {{'DELETED.TITLE' | translate}}
                    </h1>
                    <div class="flex items-center gap-2 text-sm font-normal text-gray-700">
                        {{'DELETED.SUBTITLE' | translate}}
                    </div>
                </div>

                <div class="flex items-center gap-2.5">

                    <a class="btn btn-sm btn-primary" (click)="onRestoreData()"><i
                            class="ki-filled ki-arrows-loop"></i>Восстановить</a>
                    <a class=" btn btn-sm btn-danger"><i class="ki-filled ki-trash"></i>Удалить из учета</a>
                </div>
            </div>
        </div>
        <!-- End Container -->

        <div class="container-fixed">
            <div class="grid gap-5 lg:gap-7.5">
                <div class="card card-grid min-w-full">
                    <div class="card-body scrollable-x">
                        <table id="datatable_deleted_containers" #datatableDeletedContainers>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </ng-container>

    <!-- No Data Container -->
    <ng-template #noData>
        <div class="flex flex-col items-center justify-center h-[95%]">
            <div class="mb-16">
                <img alt="image" class="dark:hidden max-h-[160px]" src="./assets/media/illustrations/11.svg">
                <img alt="image" class="light:hidden max-h-[160px]" src="./assets/media/illustrations/11-dark.svg">
            </div>
            <h3 class="text-2.5xl font-semibold text-gray-900 text-center mb-2">
                Ошибка загрузки
            </h3>
            <div class="text-md text-center text-gray-700 mb-10">
                Не удалось выполнить загрузку данных.
            </div>
        </div>
    </ng-template>
    <!-- End No Data Container -->

</ng-template>
