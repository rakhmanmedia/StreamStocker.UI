<!doctype html>
<html class="h-full" data-theme="true" data-theme-mode="light" lang="en">
<head>
  <meta charset="utf-8">
  <title>StreamStockerUI</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="assets/vendors/apexcharts/apexcharts.css" rel="stylesheet"/>
  <link href="assets/vendors/keenicons/styles.bundle.css" rel="stylesheet"/>
  <link href="assets/css/styles.css" rel="stylesheet"/>
  <link rel=”stylesheet” href=”https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body class="antialiased flex h-full text-base text-gray-700 [--tw-page-bg:#fefefe] [--tw-page-bg-dark:var(--tw-coal-500)] demo1 sidebar-fixed header-fixed bg-[--tw-page-bg] dark:bg-[--tw-page-bg-dark]">

  <style>
    .page-bg {
             background-image: url('./assets/media/images/2600x1200/bg-13.png');
         }
         .dark .page-bg {
             background-image: url('./assets/media/images/2600x1200/bg-10-dark.png');
         }
  </style>
  
  <!-- Page -->
  <!-- Main -->
  <app-root class="flex grow"></app-root>
  <!-- End Main -->
  <!-- End Page -->
  
  <!-- Scripts -->
  <script src="./assets/js/core.bundle.js">
  </script>
  <!-- <script src="./assets/vendors/apexcharts/apexcharts.min.js">
  </script> -->
  <!-- <script src="./assets/js/layouts/demo1.js">
  </script> -->
  
  <script>
    const defaultThemeMode = 'light'; // light|dark|system
    let themeMode;

    if (document.documentElement) {
      if (localStorage.getItem('theme')) {
        themeMode = localStorage.getItem('theme');
      } else if (document.documentElement.hasAttribute('data-theme-mode')) {
        themeMode = document.documentElement.getAttribute('data-theme-mode');
      } else {
        themeMode = defaultThemeMode;
      }

      if (themeMode === 'system') {
        themeMode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      document.documentElement.classList.add(themeMode);
    }
  </script>
  <!-- End of Scripts -->
</body>
</html>
